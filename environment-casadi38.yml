# Linux source-build environment: install RBDL/biorbd after creating it.
# See docs/casadi38.md. Do not install the conda biorbd binary into this environment.
name: bioptim-casadi38
channels:
  - conda-forge
dependencies:
  - python =3.11
  - cmake >=3.25
  - eigen =3.4.*
  - matplotlib-base >=3.8
  - ninja
  - numpy >=2.4,<3
  - pip
  - pytest
  - scipy
  - swig =4.4.1
  - tinyxml2
  - pip:
      - casadi ==3.8.0
