name: Regenerate Conda lockfiles

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    name: Check and regenerate Conda lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check committed lockfiles
        id: inspect
        run: |
          if python3 .github/conda-lock/check_lockfiles.py; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo 'Conda lockfiles are current; no dependency resolution is needed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up lockfile generator
        if: steps.inspect.outputs.stale == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install conda-lock
        if: steps.inspect.outputs.stale == 'true'
        run: python -m pip install --disable-pip-version-check "conda-lock==4.0.2"

      - name: Install pinned Micromamba
        if: steps.inspect.outputs.stale == 'true'
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.5.0-2"
          init-shell: none
          generate-run-shell: false

      - name: Regenerate all platforms once
        if: steps.inspect.outputs.stale == 'true'
        run: |
          micromamba --version
          conda-lock lock \
            --conda micromamba \
            --kind explicit \
            --micromamba \
            --lockfile "$RUNNER_TEMP/conda-lock.yml" \
            --virtual-package-spec .github/conda-lock/virtual-packages.yml \
            --platform linux-64 \
            --platform osx-arm64 \
            --platform win-64 \
            --file environment.yml \
            --file .github/conda-lock/ci-dependencies.yml \
            --filename-template '.github/conda-lock/conda-{platform}.lock'
          python .github/conda-lock/check_lockfiles.py --print-source-hash \
            > .github/conda-lock/source-files.sha256
          python .github/conda-lock/check_lockfiles.py

      - name: Prepare lockfiles and patch
        if: steps.inspect.outputs.stale == 'true'
        env:
          LOCKFILE_ARTIFACT: ${{ runner.temp }}/conda-lockfiles
        run: |
          mkdir -p "$LOCKFILE_ARTIFACT"
          for conda_platform in linux-64 osx-arm64 win-64; do
            cp ".github/conda-lock/conda-${conda_platform}.lock" "$LOCKFILE_ARTIFACT/"
          done
          cp .github/conda-lock/source-files.sha256 "$LOCKFILE_ARTIFACT/"
          git rev-parse HEAD > "$LOCKFILE_ARTIFACT/source-commit.txt"
          git add --intent-to-add -- \
            .github/conda-lock/conda-{linux-64,osx-arm64,win-64}.lock \
            .github/conda-lock/source-files.sha256
          git diff --binary HEAD -- \
            .github/conda-lock/conda-{linux-64,osx-arm64,win-64}.lock \
            .github/conda-lock/source-files.sha256 \
            > "$LOCKFILE_ARTIFACT/conda-lockfiles.patch"
          {
            echo '## Conda lockfiles regenerated'
            echo ''
            echo 'From a clean local checkout of the PR branch, run:'
            echo ''
            echo '```bash'
            echo 'python .github/conda-lock/update_lockfiles.py --commit-and-push'
            echo '```'
            echo ''
            echo 'Review the generated changes in the PR. The conda-lockfiles artifact also contains the exact generated files and a patch.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated lockfiles
        if: steps.inspect.outputs.stale == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: conda-lockfiles
          path: ${{ runner.temp }}/conda-lockfiles
          if-no-files-found: error
          retention-days: 14

      - name: Require regenerated lockfiles to be committed
        if: steps.inspect.outputs.stale == 'true'
        run: |
          echo '::error::From a clean local checkout of the PR branch, run: python .github/conda-lock/update_lockfiles.py --commit-and-push'
          exit 1
